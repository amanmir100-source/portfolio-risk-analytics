[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-analytics"
version = "1.0.0"
description = "End-to-end portfolio risk analytics: SQL analytics layer + NumPy/pandas risk engine + matplotlib reporting"
readme = "README.md"
authors = [{ name = "Aman Mir" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
